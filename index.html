<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/s-icon.svg" />
  <link rel="apple-touch-icon" href="/s-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet" />
  <title>Soe Min Thein — Mobile Engineer</title>
  <meta name="description"
    content="Mobile engineer building products people keep using. Six years shipping iOS and Flutter apps — commerce, streaming and enterprise systems." />

  <!-- Resolve the theme before first paint so the page never flashes the wrong one. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Google Analytics via Vite env -->
  <script type="module">
    const GA_ID = import.meta.env.VITE_GA_ID;
    if (GA_ID) {
      const s = document.createElement('script');
      s.async = true;
      s.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
      document.head.appendChild(s);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); } // eslint-disable-line no-inner-declarations
      window.gtag = gtag;
      gtag('js', new Date());
      // Disable automatic page_view; SPA sends page_view on route change
      gtag('config', GA_ID, { send_page_view: false });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
