<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicons. The mark is the wordmark's Instrument Serif "S", outlined to a
       path, on vermilion — the one brand colour that keeps its silhouette
       against both a light and a dark browser tab strip. Sizes are drawn at
       three optical weights, so the hairlines survive 16px without the large
       renders looking heavy. See public/favicon.svg. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#100f0d" media="(prefers-color-scheme: dark)" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet" />
  <title>Soe Min Thein — Mobile Engineer</title>
  <meta name="description"
    content="Mobile Engineer building products people keep using. Shipping iOS and Flutter apps — e-commerce, streaming and the enterprise systems that replace a company's spreadsheets." />

  <!-- Resolve the theme before first paint so the page never flashes the wrong one. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Google Analytics via Vite env -->
  <script type="module">
    const GA_ID = import.meta.env.VITE_GA_ID;
    if (GA_ID) {
      const s = document.createElement('script');
      s.async = true;
      s.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
      document.head.appendChild(s);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); } // eslint-disable-line no-inner-declarations
      window.gtag = gtag;
      gtag('js', new Date());
      // Disable automatic page_view; SPA sends page_view on route change
      gtag('config', GA_ID, { send_page_view: false });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
